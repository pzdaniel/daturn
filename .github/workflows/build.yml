name: Firmware bauen & Web-Installer deployen

on:
  push:
    branches: [main, master, claude/arduino-esp32-migration-kph6m4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: arduino-cli installieren
        uses: arduino/setup-arduino-cli@v2

      # Core bewusst auf 2.0.17 gepinnt: ESP32-BLE-Keyboard crasht auf Core 3.x
      # zur Laufzeit im BT-Controller-Init (kompiliert zwar, bootloopt aber).
      - name: ESP32-Core und Bibliotheken installieren
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "GFX Library for Arduino@1.4.9"
          arduino-cli lib install "NimBLE-Arduino@1.4.3"
          mkdir -p ~/Arduino/libraries
          git clone --depth 1 https://github.com/T-vK/ESP32-BLE-Keyboard ~/Arduino/libraries/ESP32-BLE-Keyboard
          # Pairing-Fix: die Bibliothek fordert ab Werk SC_MITM_BOND an - MITM ist
          # ohne PIN-Eingabemoeglichkeit widerspruechlich und fuehrt auf manchen
          # Android-Versionen zum Kopplungsabbruch. Auf SC_BOND (Just Works) umstellen.
          sed -i 's/ESP_LE_AUTH_REQ_SC_MITM_BOND/ESP_LE_AUTH_REQ_SC_BOND/g' ~/Arduino/libraries/ESP32-BLE-Keyboard/BleKeyboard.cpp
          grep -q "ESP_LE_AUTH_REQ_SC_BOND" ~/Arduino/libraries/ESP32-BLE-Keyboard/BleKeyboard.cpp
          ! grep -q "SC_MITM_BOND" ~/Arduino/libraries/ESP32-BLE-Keyboard/BleKeyboard.cpp

      # USE_NIMBLE: Bluedroid-Pairing scheitert auf neueren Android-Versionen,
      # der NimBLE-Modus der Bibliothek ist die dokumentierte Loesung.
      # DebugLevel=info: damit die Konsole (ESP Web Tools) brauchbare Logs zeigt.
      #
      # XIAO-ESP32C3-Build waehrend der Waveshare-Testphase deaktiviert (spart
      # Buildzeit) - zum Reaktivieren den Schritt aus der Git-History herstellen
      # und den ESP32-C3-Eintrag im web/manifest.json wieder ergaenzen.

      - name: Sketch kompilieren (Waveshare ESP32-S3-Touch-LCD-1.47)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=huge_app,CDCOnBoot=cdc,DebugLevel=info \
            --build-property "compiler.cpp.extra_flags=-DDATURN_BUILD=\"build-${GITHUB_RUN_NUMBER}\" -DUSE_NIMBLE=1" \
            --output-dir build-s3 \
            DaTurn_S3

      # Versionsnummer steckt in den Dateinamen: verhindert, dass der Browser
      # beim Flashen alte .bin-Dateien aus dem Cache serviert
      - name: Installer-Seite zusammenstellen
        run: |
          VER="build-${GITHUB_RUN_NUMBER}"
          mkdir -p site
          cp web/index.html site/
          sed "s/__VERSION__/${VER}/g" web/manifest.json > site/manifest.json
          cp build-s3/DaTurn_S3.ino.bootloader.bin "site/s3-bootloader-${VER}.bin"
          cp build-s3/DaTurn_S3.ino.partitions.bin "site/s3-partitions-${VER}.bin"
          cp build-s3/DaTurn_S3.ino.bin            "site/s3-firmware-${VER}.bin"
          cp "$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)" "site/boot_app0-${VER}.bin"
          ls -la site

      - name: Firmware als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: daturn-firmware
          path: site/*.bin

      # Pages funktioniert bei privaten Repos nur mit GitHub Pro – deshalb continue-on-error:
      # der Build bleibt gruen und die Firmware ist als Artefakt verfuegbar.
      - name: GitHub Pages konfigurieren
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages-Artefakt hochladen
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages deployen
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
